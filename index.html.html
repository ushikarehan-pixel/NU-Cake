<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nu Cake</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff6f61, #ff99cc, #ffe0d6);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      position: relative;
      overflow-x: hidden;
      color: #222;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    header {
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }
    header img {
      width: 180px;
      border-radius: 50%;
      margin-bottom: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    header h1 {
      font-family: 'Pacifico', cursive;
      color: #fff;
      margin: 0;
      text-shadow: 0 0 10px rgba(255,255,255,0.7);
    }
    header p {
      color: #fff;
      font-style: italic;
    }
    nav {
      background-color: rgba(0,0,0,0.3);
      padding: 10px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
    }
    .container {
      padding: 20px;
      position: relative;
      z-index: 2;
    }
    .order-form {
      background-color: rgba(255,255,255,0.9);
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    .order-form input, .order-form select, .order-form button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .order-form button {
      background-color: #ff6f61;
      color: white;
      border: none;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .order-form button:hover {
      background-color: #e65c50;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }
    footer {
      background-color: rgba(0,0,0,0.6);
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }
    footer a {
      color: #ff99cc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Nu Cake Logo">
    <h1>Nu Cake</h1>
    <p>Delicious cakes, baked fresh for you</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Online Orders</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <h2>Place Your Online Order</h2>
    <form class="order-form">
      <label for="cake-type">Choose your cake:</label>
      <select id="cake-type" name="cake-type" required>
        <option value="">--Select--</option>
        <option value="chocolate">Chocolate Cake</option>
        <option value="vanilla">Vanilla Cake</option>
        <option value="red-velvet">Red Velvet Cake</option>
        <option value="cheesecake">Cheesecake</option>
      </select>

      <label for="size">Size:</label>
      <select id="size" name="size" required>
        <option value="">--Select--</option>
        <option value="small">Small (1 lb)</option>
        <option value="medium">Medium (2 lb)</option>
        <option value="large">Large (3 lb)</option>
      </select>

      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="address">Delivery Address:</label>
      <input type="text" id="address" name="address" required>

      <button type="submit">Submit Order</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 Nu Cake. All rights reserved.</p>
    <p>📞 Call us: <a href="tel:0719625138">0719625138</a></p>
    <p>💬 WhatsApp: <a href="https://wa.me/94776571871" target="_blank">0776571871</a></p>
  </footer>
</body>
</html>
